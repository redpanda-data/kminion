---
version: 2
release:
  name_template: '{{.Version}} / {{time "2006-01-02"}}'
  prerelease: auto
  mode: append
  footer: |
    ## Docker Image
    Use the following command to pull this release's Docker image:
    ```sh
    docker pull redpandadata/kminion:{{ .Tag }}
    ```
changelog:
  disable: false
  # github-native lists the merged pull requests and credits their authors, also when
  # the commit email is not linked to a GitHub account. It does not support filters.
  use: github-native
builds:
  - id: kminion
    binary: kminion
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.builtAt={{.Date}} -X main.commit={{.Commit}}
checksum:
  name_template: 'checksums.txt'
