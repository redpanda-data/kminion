version: 2
updates:
  # Keep the Redpanda image of the local test setup up to date.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
  # Keep the Go modules up to date, so security fixes in dependencies reach KMinion.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
